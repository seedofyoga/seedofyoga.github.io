bio: |
  Hi everyone! I'm Pierre, a certified yoga teacher specialising in Hatha and Vinyasa. What matters to me is making yoga accessible to everyone, regardless of flexibility, age, body type, or level.

  My yoga journey began in 2015 in Exeter, UK, where I discovered Hatha yoga. In 2023, I took the leap and became a teacher by completing my RYT 200 training at SoShanti Yoga School in Dharamshala, India. I also took an immersion course at the Himalayan Iyengar Yoga Centre, and I've been practicing Vipassana meditation for several years. I then taught nomadically for two years across India and South America.

  In my classes, I blend traditional Hatha alignment with the fluid, breath-synchronised movement of Vinyasa. I aim to create an inclusive space where everyone, regardless of their level, feels supported in exploring their own practice.

  Off the mat, you'll find me cooking, trying to live healthily, or practicing permaculture. I'm passionate about sustainable lifestyles, as well as mental and physical wellbeing.

  See you soon on the mat!
