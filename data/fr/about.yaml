bio: |
  Bienvenue à tous ! Je suis Pierre, prof de yoga certifié spécialisé dans le Hatha, le Vinyasa et le Yin. Ce qui compte pour moi, c'est de rendre le yoga accessible à tout le monde, peu importe votre souplesse, votre âge, votre morphologie ou votre niveau.

  Mon parcours de yogi a commencé en 2015 à Exeter, au Royaume-Uni, où j'ai découvert le Hatha yoga. En 2023, j'ai sauté le pas : je suis devenu enseignant en suivant ma formation RYT 200 à l'école SoShanti Yoga, à Dharamshala en Inde. J'ai aussi obtenu une certification de 100 heures en Yin yoga. J'ai ensuite enseigné de manière nomade pendant 2 ans à travers l'Inde et l'Amérique du Sud.

  Dans mes cours, je mélange l'alignement traditionnel du Hatha avec le mouvement fluide et synchronisé à la respiration du Vinyasa. J'essaie de créer un espace inclusif où chacun, quel que soit son niveau, se sente soutenu pour explorer sa propre pratique.

  En dehors du tapis, vous me trouverez en train de cuisiner, de chercher à vivre sainement ou de pratiquer la permaculture. Je suis passionné par les modes de vie durables, et par le bien-être, autant mental que physique.

  À bientôt sur le tapis !
